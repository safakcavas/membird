<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Download Membird - Everyday Spanish practice for iOS and Android" />
    <title>Download Membird | App Store & Google Play</title>
    <link rel="icon" type="image/png" href="../icon.png" />
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        if (params.get('noredirect') === '1') return;

        var force = (params.get('platform') || '').toLowerCase();
        var ua = navigator.userAgent || navigator.vendor || window.opera || '';
        var isIOS = force === 'ios' || /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var isAndroid = force === 'android' || /android/i.test(ua);

        var APP_STORE_URL = 'https://apps.apple.com/app/id6796071322';
        var PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.safakcavas.membird';

        if (isIOS) {
          window.location.replace(APP_STORE_URL);
        } else if (isAndroid) {
          window.location.replace(PLAY_STORE_URL);
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #1e2637;
        background: #f6f8fc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        line-height: 1.5;
      }
      .card {
        background: #ffffff;
        border-radius: 28px;
        box-shadow: 0 10px 40px rgba(30, 38, 55, 0.08);
        padding: 44px 32px 36px;
        max-width: 440px;
        width: 100%;
        text-align: center;
      }
      .app-icon {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow: 0 8px 24px rgba(112, 80, 232, 0.22);
        margin-bottom: 20px;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 800;
        margin: 0 0 8px;
        color: #1e2637;
        letter-spacing: -0.02em;
      }
      .tagline {
        color: #64748b;
        font-size: 0.98rem;
        margin: 0 0 28px;
        line-height: 1.5;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #f1f3fd;
        color: #553bb8;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 24px;
      }
      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid #a99cf4;
        border-top-color: #553bb8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .badges {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 28px;
      }
      .badge-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        color: #ffffff;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 14px;
        font-weight: 600;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      .badge-btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      .badge-btn svg {
        margin-right: 12px;
        flex-shrink: 0;
      }
      .badge-text {
        text-align: left;
        line-height: 1.2;
      }
      .badge-sub {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.85;
      }
      .badge-main {
        font-size: 1.15rem;
        font-weight: 700;
      }
      .legal-links {
        display: flex;
        justify-content: center;
        gap: 16px;
        border-top: 1px solid #eef2f6;
        padding-top: 20px;
        font-size: 0.85rem;
      }
      .legal-links a {
        color: #8392a5;
        text-decoration: none;
        transition: color 0.15s ease;
      }
      .legal-links a:hover {
        color: #553bb8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="../icon.png" alt="Membird Icon" class="app-icon" />
      <h1>Membird</h1>
      <p class="tagline">Everyday Spanish practice through vocabulary, example sentences, verb conjugation, and pronunciation lessons.</p>

      <div class="status" id="redirect-status">
        <span class="spinner" id="spinner"></span>
        <span id="status-text">Redirecting to store...</span>
      </div>

      <div class="badges">
        <!-- iOS App Store Button -->
        <a class="badge-btn" id="ios-btn" href="https://apps.apple.com/app/id6796071322">

          </svg>
          <div class="badge-text">
            <div class="badge-sub">Download on the</div>

        <!-- Android Google Play Button -->
        <a class="badge-btn" id="android-btn" href="https://play.google.com/store/apps/details?id=com.safakcavas.membird">
          <svg width="28" height="28" viewBox="0 0 512 512">
            <path fill="#4285F4" d="M325.3 234.3L10.5 45.3c-.3 1.2-.5 2.5-.5 3.9v413.6c0 1.4.2 2.7.5 3.9l314.8-232.4z"/>
            <path fill="#FBBC04" d="M399.7 298.5l-74.4-64.2L10.5 466.7c3.4 3.7 8.3 6.1 13.8 6.1 3.5 0 6.9-.9 9.8-2.6l365.6-211.7z"/>
            <path fill="#0F9D58" d="M399.7 213.5L34.1 41.8c-2.9-1.7-6.3-2.6-9.8-2.6-5.5 0-10.4 2.4-13.8 6.1l314.8 232.4 74.4-64.2z"/>
            <path fill="#EA4335" d="M495.2 239.3l-95.5-55.3-74.4 64.2 74.4 64.2 95.5-55.3c7.2-4.2 11.8-11.8 11.8-20.1s-4.6-15.9-11.8-17.7z"/>
          </svg>
          <div class="badge-text">
            <div class="badge-sub">GET IT ON</div>
            <div class="badge-main">Google Play</div>
          </div>
        </a>
      </div>

      <nav class="legal-links">
        <a href="../privacy.html">Privacy</a>
        <a href="../terms.html">Terms</a>
        <a href="../support.html">Support</a>
      </nav>
    </div>

    <script>
      (function() {
        var ua = navigator.userAgent || navigator.vendor || window.opera || '';
        var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var isAndroid = /android/i.test(ua);
        var statusText = document.getElementById('status-text');
        var spinner = document.getElementById('spinner');
        var iosBtn = document.getElementById('ios-btn');
        var androidBtn = document.getElementById('android-btn');

        if (isIOS) {
          statusText.textContent = "Opening in App Store...";
          iosBtn.style.outline = "3px solid #7050e8";
        } else if (isAndroid) {
          statusText.textContent = "Opening in Google Play...";
          androidBtn.style.outline = "3px solid #7050e8";
        } else {
          // Desktop / Laptop
          if (spinner) spinner.style.display = "none";
          statusText.textContent = "Available on iOS and Android";
        }
      })();
    </script>
  </body>
</html>
