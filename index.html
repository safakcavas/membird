    <title>Membird</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1e2637; background: #f6f8fc; }
      body { margin: 0; line-height: 1.6; }
      main { box-sizing: border-box; max-width: 720px; min-height: 100vh; margin: 0 auto; padding: 72px 24px; }
      h1 { font-size: 2.3rem; margin: 0 0 8px; }
      p { color: #506078; }
      nav { display: grid; gap: 14px; margin-top: 32px; }
      a { display: block; border-radius: 14px; padding: 18px 20px; color: #352a78; background: #fff; font-weight: 700; text-decoration: none; box-shadow: 0 4px 18px rgba(35, 49, 75, .08); }
      a:hover, a:focus { outline: 3px solid #a99cf4; }
    </style>
  </head>
  <body>
    <main>
      <h1>Membird</h1>
      <p>Everyday Spanish practice through vocabulary, example sentences, verb conjugation, and pronunciation lessons.</p>
      <nav aria-label="Membird information">

        <a href="support.html">Support</a>
